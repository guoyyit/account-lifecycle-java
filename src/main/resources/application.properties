spring.application.name=account-lifecycle

# 事件日志目录（进程内持久化，重启后重放重建全部状态）
account-lifecycle.data-dir=${user.dir}/data/lifecycle
# 周期扫描调度；测试与演示默认关闭，需要治理时改为 true
account-lifecycle.scheduler-enabled=false
account-lifecycle.scan-interval=30s

# 默认分组策略（仅在首次启动、尚无策略事件时播种）
account-lifecycle.default-dormant-threshold=90d
account-lifecycle.default-credential-validity=365d
account-lifecycle.default-grace-period=7d
account-lifecycle.default-recycle-buffer=30d
