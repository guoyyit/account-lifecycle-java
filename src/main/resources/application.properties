# 账号生命周期治理服务配置
account-lifecycle.data-dir=data/account-lifecycle
account-lifecycle.scan-interval=PT1M
account-lifecycle.scheduler-enabled=false
account-lifecycle.default-dormancy-threshold=P90D
account-lifecycle.default-credential-grace-period=P7D
account-lifecycle.default-dormant-buffer-period=P30D
account-lifecycle.default-account-max-lifetime=PT0S
account-lifecycle.default-recovery-pending-ttl=PT24H
account-lifecycle.default-verification-ttl=PT10M
